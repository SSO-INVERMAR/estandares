<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Capacitaciones</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #eef1f5;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
    margin: 0;
  }
  .card {
    background: #fff;
    padding: 32px;
    border-radius: 12px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 640px;
  }
  h1 { font-size: 21px; margin-bottom: 4px; color: #1a1a1a; }
  p.subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }
  fieldset {
    border: 1px solid #e3e5e9;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
  }
  legend { font-weight: 700; font-size: 13px; color: #4a7dfc; padding: 0 6px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; margin-top: 14px; }
  label:first-of-type { margin-top: 0; }
  input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #4a7dfc; }
  input[readonly] { background: #f4f5f7; color: #444; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .participante {
    border: 1px dashed #c9cdd4;
    border-radius: 8px;
    padding: 12px;
    margin-top: 12px;
    position: relative;
  }
  .participante .quitar {
    position: absolute;
    top: 8px;
    right: 8px;
    background: #fde8e8;
    color: #c0392b;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    padding: 4px 8px;
    cursor: pointer;
    width: auto;
  }
  .participante .quitar:hover { background: #f8caca; }
  #agregarParticipante {
    background: #eef2ff;
    color: #4a7dfc;
    border: 1px dashed #4a7dfc;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    margin-top: 10px;
  }
  #agregarParticipante:hover { background: #e3e9ff; }
  button[type="submit"] {
    width: 100%;
    margin-top: 8px;
    padding: 13px;
    background: #4a7dfc;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button[type="submit"]:hover { background: #3a6ae8; }
  button[type="submit"]:disabled { background: #aaa; cursor: not-allowed; }
  .hint { font-size: 12px; color: #888; margin-top: 4px; }
  .hint.error-text { color: #c0392b; }
  #status { margin-top: 16px; font-size: 14px; text-align: center; font-weight: 600; }
  #status.success { color: #1a9c4b; }
  #status.error { color: #d32f2f; }
</style>
</head>

  // Indice por rut normalizado (sin puntos, minuscula, con guion) para busqueda rapida
  const INDICE_EMPLEADOS = {};

    INDICE_EMPLEADOS[normalizarRut(e.rut)] = e;
  });

  function normalizarRut(rut) {
    return (rut || "").toString().toLowerCase().replace(/\./g, "").replace(/\s/g, "").trim();

  function buscarEmpleado(rut) {
    return INDICE_EMPLEADOS[normalizarRut(rut)] || null;

      hintRelator.textContent = "";

    listaParticipantes.appendChild(div);

    const rutInput = div.querySelector('.rutParticipante');
    const nombreInput = div.querySelector('.nombreParticipante');
    const cargoInput = div.querySelector('.cargoParticipante');
    const hint = div.querySelector('.hintParticipante');

    rutInput.addEventListener('input', function() {
      const emp = buscarEmpleado(this.value);
      if (emp) {
        nombreInput.value = emp.nombre;
        cargoInput.value = emp.cargo;
        hint.textContent = "";
        hint.className = "hint hintParticipante";
      } else {
        nombreInput.value = "";
        cargoInput.value = "";
        hint.textContent = this.value ? "RUT no encontrado en la base de datos" : "";
        hint.className = "hint hintParticipante error-text";

    });

  agregarFilaParticipante();

  const form = document.getElementById('miFormulario');

  const status = document.getElementById('status');

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    // Validar campos generales obligatorios (por si el navegador no bloqueó el envío)
    const camposObligatorios = [

      { id: 'centro', label: 'Centro' },
      { id: 'fecha', label: 'Fecha' },
      { id: 'hora', label: 'Hora' },
      { id: 'duracion', label: 'Duración' }
    ];
    for (const campo of camposObligatorios) {
      if (!document.getElementById(campo.id).value) {
        status.textContent = "El campo \"" + campo.label + "\" es obligatorio.";
        status.className = "error";
        return;
      }
    }

    if (!rutRelatorInput.value.trim()) {
      status.textContent = "El RUT del relator es obligatorio.";
      status.className = "error";
      return;
    }

    if (!nombreRelatorInput.value) {
      status.textContent = "El RUT del relator no fue encontrado en la base de datos.";
      status.className = "error";
      return;
    }

    // Recolectar y validar participantes: TODOS los campos de cada fila son obligatorios
    const filas = listaParticipantes.querySelectorAll('.participante');
    const participantes = [];

    if (filas.length === 0) {
      status.textContent = "Debe registrar al menos un participante.";
      status.className = "error";
      return;
    }

    for (const div of filas) {
      const rut = div.querySelector('.rutParticipante').value.trim();
      const nombre = div.querySelector('.nombreParticipante').value.trim();
      const cargo = div.querySelector('.cargoParticipante').value.trim();

      if (!rut) {
        status.textContent = "Debe ingresar el RUT de todos los participantes.";
        status.className = "error";
        return;
      }
      if (!nombre) {
        status.textContent = "Hay un RUT de participante que no fue encontrado en la base de datos.";
        status.className = "error";
        return;
      }
      participantes.push({ rut: rut, nombre: nombre, cargo: cargo });
    }

    const datos = {
      capacitacion: document.getElementById('capacitacion').value,
      centro: document.getElementById('centro').value,
      fecha: document.getElementById('fecha').value,
      hora: document.getElementById('hora').value,
      duracion: document.getElementById('duracion').value,
      rutRelator: rutRelatorInput.value.trim(),
      nombreRelator: nombreRelatorInput.value,
      cargoRelator: cargoRelatorInput.value,
      participantes: participantes,
      marcaTiempo: new Date().toISOString()
    };

    boton.disabled = true;
    boton.textContent = "Enviando...";
    status.textContent = "";
    status.className = "";

    fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(datos)
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.result === "success") {
        status.textContent = "Registro guardado correctamente (" + data.filas + " fila(s)).";
        status.className = "success";
        form.reset();
        listaParticipantes.innerHTML = "";
        contadorParticipantes = 0;
        agregarFilaParticipante();
      } else {
        throw new Error(data.error || "Error desconocido");
      }
    })
    .catch(function(err) {
      status.textContent = "Hubo un error al enviar. Intenta de nuevo.";
      status.className = "error";
      console.error(err);
    })
    .finally(function() {
      boton.disabled = false;
      boton.textContent = "Registrar";
    });
  });
</script>

</body>
</html>
