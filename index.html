<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Capacitación | Invermar</title>
<style>
  :root{
    --azul:#00205B;
    --azul-claro:#1a3d7c;
    --azul-suave:#eef1f8;
    --gris-borde:#d4d9e3;
    --gris-texto:#3a3f4b;
    --verde-ok:#1e8e3e;
    --rojo-error:#c5221f;
    --radio:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Arial,Helvetica,sans-serif;
    background:linear-gradient(180deg,var(--azul-suave) 0%, #ffffff 220px);
    color:var(--gris-texto);
    padding-bottom:60px;
  }
  header{
    background:#ffffff;
    padding:22px 16px 18px;
    text-align:center;
    border-bottom:4px solid var(--azul);
  }
  header img{
    max-width:260px;
    width:60%;
    height:auto;
  }
  header h1{
    font-size:1.25rem;
    color:var(--azul);
    margin:14px 0 4px;
    font-weight:700;
    letter-spacing:.2px;
  }
  header p{
    margin:0;
    color:#6b7280;
    font-size:.9rem;
  }
  .contenedor{
    max-width:640px;
    margin:20px auto;
    padding:0 16px;
  }
  .tarjeta{
    background:#fff;
    border:1px solid var(--gris-borde);
    border-radius:var(--radio);
    padding:20px 18px;
    margin-bottom:18px;
    box-shadow:0 1px 3px rgba(0,32,91,0.06);
  }
  .tarjeta h2{
    font-size:1rem;
    color:var(--azul);
    margin:0 0 16px;
    padding-bottom:10px;
    border-bottom:2px solid var(--azul-suave);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .tarjeta h2 .num{
    background:var(--azul);
    color:#fff;
    width:24px;height:24px;
    border-radius:50%;
    display:inline-flex;
    align-items:center;justify-content:center;
    font-size:.78rem;
    flex:none;
  }
  label{
    display:block;
    font-size:.85rem;
    font-weight:600;
    color:var(--gris-texto);
    margin:14px 0 6px;
  }
  label.req::after{
    content:" *";
    color:var(--rojo-error);
  }
  input[type=text],
  input[type=date],
  input[type=time],
  input[type=number],
  select{
    width:100%;
    padding:11px 12px;
    border:1.5px solid var(--gris-borde);
    border-radius:8px;
    font-size:.95rem;
    background:#fff;
    color:var(--gris-texto);
    font-family:inherit;
  }
  input:focus, select:focus{
    outline:none;
    border-color:var(--azul);
    box-shadow:0 0 0 3px rgba(0,32,91,0.12);
  }
  input[readonly]{
    background:#f3f5f9;
    color:#555;
  }
  .fila2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .fila3{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:12px;
  }
  small.ayuda{
    display:block;
    color:#8a8f99;
    font-size:.76rem;
    margin-top:4px;
  }
  .estado-busqueda{
    font-size:.78rem;
    margin-top:5px;
    min-height:16px;
  }
  .estado-busqueda.ok{color:var(--verde-ok);}
  .estado-busqueda.error{color:var(--rojo-error);}
  .estado-busqueda.buscando{color:#8a8f99;}

  .participante{
    border:1.5px dashed var(--gris-borde);
    border-radius:9px;
    padding:14px 14px 6px;
    margin-top:14px;
    position:relative;
    background:#fbfcfe;
  }
  .participante .etiqueta-part{
    position:absolute;
    top:-11px;
    left:12px;
    background:var(--azul);
    color:#fff;
    font-size:.72rem;
    font-weight:700;
    padding:2px 10px;
    border-radius:20px;
  }
  .btn-quitar{
    position:absolute;
    top:-11px;
    right:10px;
    background:#fff;
    border:1.5px solid var(--rojo-error);
    color:var(--rojo-error);
    font-size:.72rem;
    font-weight:700;
    padding:2px 10px;
    border-radius:20px;
    cursor:pointer;
  }
  .btn-agregar{
    width:100%;
    margin-top:16px;
    padding:12px;
    background:#fff;
    border:2px dashed var(--azul);
    color:var(--azul);
    font-weight:700;
    font-size:.9rem;
    border-radius:9px;
    cursor:pointer;
  }
  .btn-agregar:hover{background:var(--azul-suave);}

  .zona-foto{
    border:2px dashed var(--gris-borde);
    border-radius:10px;
    padding:20px;
    text-align:center;
    cursor:pointer;
    background:#fbfcfe;
  }
  .zona-foto:hover{border-color:var(--azul);}
  .zona-foto svg{margin-bottom:8px;}
  .zona-foto p{margin:0;font-size:.88rem;color:#6b7280;}
  .previa-foto{
    margin-top:14px;
    text-align:center;
  }
  .previa-foto img{
    max-width:100%;
    max-height:280px;
    border-radius:8px;
    border:1.5px solid var(--gris-borde);
  }
  .previa-foto button{
    display:block;
    margin:10px auto 0;
    background:none;
    border:none;
    color:var(--rojo-error);
    font-size:.82rem;
    font-weight:600;
    cursor:pointer;
  }
  #inputFoto, #inputCamara{display:none;}
  .botones-foto{
    display:flex;
    gap:10px;
    margin-top:12px;
  }
  .botones-foto button{
    flex:1;
    padding:10px;
    border-radius:8px;
    border:1.5px solid var(--azul);
    background:#fff;
    color:var(--azul);
    font-weight:600;
    font-size:.85rem;
    cursor:pointer;
  }
  .botones-foto button:hover{background:var(--azul-suave);}

  .btn-enviar{
    width:100%;
    padding:16px;
    background:var(--azul);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:1.02rem;
    font-weight:700;
    cursor:pointer;
    letter-spacing:.3px;
  }
  .btn-enviar:hover{background:var(--azul-claro);}
  .btn-enviar:disabled{background:#9aa5c0;cursor:not-allowed;}

  .mensaje{
    display:none;
    padding:14px 16px;
    border-radius:9px;
    font-size:.9rem;
    margin-bottom:16px;
    font-weight:600;
    text-align:center;
  }
  .mensaje.exito{background:#e6f4ea;color:var(--verde-ok);border:1px solid #b7e1c1;}
  .mensaje.error{background:#fce8e6;color:var(--rojo-error);border:1px solid #f6c6c3;}
  .mensaje.mostrar{display:block;}

  footer{
    text-align:center;
    color:#9aa0ac;
    font-size:.75rem;
    margin-top:20px;
    padding:0 16px;
  }

  @media (max-width:480px){
    .fila2, .fila3{grid-template-columns:1fr;}
    header h1{font-size:1.08rem;}
  }
</style>
</head>

  <h1>Registro de Capacitación</h1>
  <p>Estándares Preventivos · Centros de Cultivo</p>
</header>

<div class="contenedor">

  <div id="mensajeExito" class="mensaje exito"></div>
  <div id="mensajeError" class="mensaje error"></div>

  <form id="formCapacitacion">

    <!-- 1. Datos de la actividad -->
    <div class="tarjeta">
      <h2><span class="num">1</span> Datos de la actividad</h2>

      <label class="req" for="capacitacion">Capacitación</label>
      <select id="capacitacion" required></select>

      <label class="req" for="centro">Centro</label>
      <select id="centro" required></select>

      <div class="fila3">
        <div>
          <label class="req" for="fecha">Fecha</label>
          <input type="date" id="fecha" required>
        </div>
        <div>
          <label class="req" for="hora">Hora</label>
          <input type="time" id="hora" required>
        </div>
        <div>
          <label class="req" for="duracion">Duración (min)</label>
          <input type="number" id="duracion" min="1" step="1" placeholder="Ej: 30" required>
        </div>
      </div>
    </div>

    <!-- 2. Relator -->
    <div class="tarjeta">
      <h2><span class="num">2</span> Relator</h2>

      <label class="req" for="rutRelator">RUT Relator</label>
      <input type="text" id="rutRelator" placeholder="12345678-9" required>
      <div id="estadoRelator" class="estado-busqueda"></div>

      <div class="fila2">
        <div>
          <label>Nombre Relator</label>
          <input type="text" id="nombreRelator" readonly placeholder="Se completa automáticamente">
        </div>
        <div>
          <label>Cargo Relator</label>
          <input type="text" id="cargoRelator" readonly placeholder="Se completa automáticamente">
        </div>
      </div>
    </div>

    <!-- 3. Participantes -->
    <div class="tarjeta">
      <h2><span class="num">3</span> Participantes</h2>
      <div id="listaParticipantes"></div>
      <button type="button" class="btn-agregar" id="btnAgregarParticipante">+ Agregar otro participante</button>
    </div>

    <!-- 4. Evidencia -->
    <div class="tarjeta">
      <h2><span class="num">4</span> Evidencia fotográfica</h2>

      <div class="zona-foto" id="zonaFoto">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#00205B" stroke-width="1.6"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <p>Toca para tomar una foto o subir una imagen</p>
      </div>

      <div class="botones-foto">
        <button type="button" id="btnCamara">📷 Tomar foto</button>
        <button type="button" id="btnGaleria">🖼️ Subir imagen</button>
      </div>

      <input type="file" id="inputCamara" accept="image/*" capture="environment">
      <input type="file" id="inputFoto" accept="image/*">

      <div class="previa-foto" id="previaFoto" style="display:none;">
        <img id="imgPrevia" src="" alt="Evidencia">
        <button type="button" id="btnQuitarFoto">Quitar foto</button>
      </div>
    </div>

    <button type="submit" class="btn-enviar" id="btnEnviar">Enviar registro</button>
  </form>

  <footer>Invermar S.A. — Formulario conectado a Google Drive</footer>
</div>

<script>
/* =========================================================
   CONFIGURACIÓN — reemplazar con la URL de tu Web App de
   Google Apps Script (ver "Instrucciones_Configuracion.md")

const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbyUMzk_hNsrn8GbUxJM676a7RR9jBKullzvX2CQlQcQgJENZJ3mENWj3kb2xZxF5XI/exec";

/* Listas desplegables */
const LISTA_CAPACITACIONES = [

/* ---------- Utilidades ---------- */
function normalizarRut(rut){
  return (rut || "").toString().replace(/\./g,"").replace(/\s/g,"").toUpperCase().trim();
}

function llenarSelect(select, opciones){
  select.innerHTML = '<option value="">Seleccione…</option>';
  opciones.forEach(op=>{
    const o = document.createElement("option");
    o.value = op; o.textContent = op;
    select.appendChild(o);
  });
}

/* ---------- Inicialización ---------- */
document.addEventListener("DOMContentLoaded", ()=>{
  llenarSelect(document.getElementById("capacitacion"), LISTA_CAPACITACIONES);
  llenarSelect(document.getElementById("centro"), LISTA_CENTROS);

  // fecha por defecto: hoy
  const hoy = new Date();
  document.getElementById("fecha").value = hoy.toISOString().slice(0,10);

  agregarParticipante(); // primer participante obligatorio

  document.getElementById("rutRelator").addEventListener("blur", (e)=>{
    buscarPersona(e.target.value, "estadoRelator", "nombreRelator", "cargoRelator");
  });

  document.getElementById("btnAgregarParticipante").addEventListener("click", agregarParticipante);

  configurarFoto();

  document.getElementById("formCapacitacion").addEventListener("submit", enviarFormulario);
});

/* ---------- Búsqueda de persona por RUT ---------- */
async function buscarPersona(rut, idEstado, idNombre, idCargo){
  const estadoEl = document.getElementById(idEstado);
  const nombreEl = document.getElementById(idNombre);
  const cargoEl  = document.getElementById(idCargo);
  const rutNorm = normalizarRut(rut);

  nombreEl.value = "";
  cargoEl.value = "";

  if(!rutNorm){
    estadoEl.textContent = "";
    estadoEl.className = "estado-busqueda";
    return;
  }

  estadoEl.textContent = "Buscando…";
  estadoEl.className = "estado-busqueda buscando";

  try{
    const resp = await fetch(`${URL_APPS_SCRIPT}?action=buscarRut&rut=${encodeURIComponent(rutNorm)}`);
    const datos = await resp.json();
    if(datos.encontrado){
      nombreEl.value = datos.nombre;
      cargoEl.value = datos.cargo;
      estadoEl.textContent = "✓ Persona encontrada";
      estadoEl.className = "estado-busqueda ok";
    } else {
      estadoEl.textContent = "RUT no encontrado en la base. Verifique o complete manualmente.";
      estadoEl.className = "estado-busqueda error";
      nombreEl.readOnly = false;
      cargoEl.readOnly = false;
    }
  }catch(err){
    estadoEl.textContent = "No se pudo conectar con la base de datos.";
    estadoEl.className = "estado-busqueda error";
  }
}

/* ---------- Participantes dinámicos ---------- */
let contadorParticipantes = 0;

function agregarParticipante(){
  contadorParticipantes++;
  const id = contadorParticipantes;
  const div = document.createElement("div");
  div.className = "participante";
  div.dataset.id = id;
  div.innerHTML = `
    <span class="etiqueta-part">Participante ${id}</span>
    ${id > 1 ? '<button type="button" class="btn-quitar">Quitar</button>' : ''}
    <label class="req">RUT Participante</label>
    <input type="text" class="rutParticipante" placeholder="12345678-9" required>
    <div class="estado-busqueda"></div>
    <div class="fila2">
      <div>
        <label>Nombre Participante</label>
        <input type="text" class="nombreParticipante" readonly placeholder="Se completa automáticamente">
      </div>
      <div>
        <label>Cargo Participante</label>
        <input type="text" class="cargoParticipante" readonly placeholder="Se completa automáticamente">
      </div>
    </div>
  `;
  document.getElementById("listaParticipantes").appendChild(div);

  const inputRut = div.querySelector(".rutParticipante");
  const estadoDiv = div.querySelector(".estado-busqueda");
  const nombreInput = div.querySelector(".nombreParticipante");
  const cargoInput = div.querySelector(".cargoParticipante");

  inputRut.addEventListener("blur", async ()=>{
    const rutNorm = normalizarRut(inputRut.value);
    nombreInput.value = "";
    cargoInput.value = "";
    if(!rutNorm){ estadoDiv.textContent=""; estadoDiv.className="estado-busqueda"; return; }
    estadoDiv.textContent = "Buscando…";
    estadoDiv.className = "estado-busqueda buscando";
    try{
      const resp = await fetch(`${URL_APPS_SCRIPT}?action=buscarRut&rut=${encodeURIComponent(rutNorm)}`);
      const datos = await resp.json();
      if(datos.encontrado){
        nombreInput.value = datos.nombre;
        cargoInput.value = datos.cargo;
        estadoDiv.textContent = "✓ Persona encontrada";
        estadoDiv.className = "estado-busqueda ok";
      }else{
        estadoDiv.textContent = "RUT no encontrado. Verifique o complete manualmente.";
        estadoDiv.className = "estado-busqueda error";
        nombreInput.readOnly = false;
        cargoInput.readOnly = false;
      }
    }catch(e){
      estadoDiv.textContent = "No se pudo conectar con la base de datos.";
      estadoDiv.className = "estado-busqueda error";
    }
  });

  const btnQuitar = div.querySelector(".btn-quitar");
  if(btnQuitar){
    btnQuitar.addEventListener("click", ()=> div.remove());
  }
}

/* ---------- Foto ---------- */
let fotoBase64 = null;
let fotoNombre = null;

function configurarFoto(){
  const zona = document.getElementById("zonaFoto");
  const inputCamara = document.getElementById("inputCamara");
  const inputFoto = document.getElementById("inputFoto");
  const btnCamara = document.getElementById("btnCamara");
  const btnGaleria = document.getElementById("btnGaleria");
  const previa = document.getElementById("previaFoto");
  const imgPrevia = document.getElementById("imgPrevia");
  const btnQuitar = document.getElementById("btnQuitarFoto");

  zona.addEventListener("click", ()=> inputFoto.click());
  btnCamara.addEventListener("click", ()=> inputCamara.click());
  btnGaleria.addEventListener("click", ()=> inputFoto.click());

  [inputCamara, inputFoto].forEach(inp=>{
    inp.addEventListener("change", (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      fotoNombre = file.name || "evidencia.jpg";
      const reader = new FileReader();
      reader.onload = (ev)=>{
        fotoBase64 = ev.target.result;
        imgPrevia.src = fotoBase64;
        previa.style.display = "block";
        zona.style.display = "none";
        document.querySelector(".botones-foto").style.display = "none";
      };
      reader.readAsDataURL(file);
    });
  });

  btnQuitar.addEventListener("click", ()=>{
    fotoBase64 = null;
    fotoNombre = null;
    inputCamara.value = "";
    inputFoto.value = "";
    previa.style.display = "none";
    zona.style.display = "block";
    document.querySelector(".botones-foto").style.display = "flex";
  });
}

/* ---------- Envío del formulario ---------- */
async function enviarFormulario(e){
  e.preventDefault();

  const btnEnviar = document.getElementById("btnEnviar");
  const msgExito = document.getElementById("mensajeExito");
  const msgError = document.getElementById("mensajeError");
  msgExito.className = "mensaje exito";
  msgError.className = "mensaje error";

  // recolectar participantes
  const nodos = document.querySelectorAll(".participante");
  const participantes = [];
  for(const nodo of nodos){
    const rut = normalizarRut(nodo.querySelector(".rutParticipante").value);
    const nombre = nodo.querySelector(".nombreParticipante").value.trim();
    const cargo = nodo.querySelector(".cargoParticipante").value.trim();
    if(!rut){
      msgError.textContent = "Debe ingresar el RUT de todos los participantes.";
      msgError.className = "mensaje error mostrar";
      window.scrollTo(0,0);
      return;
    }
    participantes.push({rut, nombre, cargo});
  }

  const datos = {
    capacitacion: document.getElementById("capacitacion").value,
    centro: document.getElementById("centro").value,
    fecha: document.getElementById("fecha").value,
    hora: document.getElementById("hora").value,
    duracion: document.getElementById("duracion").value,
    rutRelator: normalizarRut(document.getElementById("rutRelator").value),
    nombreRelator: document.getElementById("nombreRelator").value.trim(),
    cargoRelator: document.getElementById("cargoRelator").value.trim(),
    participantes: participantes,
    evidenciaBase64: fotoBase64,
    evidenciaNombre: fotoNombre
  };

  if(!datos.capacitacion || !datos.centro || !datos.fecha || !datos.hora || !datos.duracion || !datos.rutRelator){
    msgError.textContent = "Por favor complete todos los campos obligatorios.";
    msgError.className = "mensaje error mostrar";
    window.scrollTo(0,0);
    return;
  }

  btnEnviar.disabled = true;
  btnEnviar.textContent = "Enviando…";
  msgError.className = "mensaje error";

  try{
    const resp = await fetch(URL_APPS_SCRIPT, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"}, // evita preflight CORS en Apps Script
      body: JSON.stringify(datos)
    });
    const resultado = await resp.json();

    if(resultado.status === "success"){
      msgExito.textContent = "✓ Registro enviado correctamente. Se guardó en la base de datos.";
      msgExito.className = "mensaje exito mostrar";
      window.scrollTo(0,0);
      document.getElementById("formCapacitacion").reset();
      document.getElementById("listaParticipantes").innerHTML = "";
      contadorParticipantes = 0;
      agregarParticipante();
      document.getElementById("btnQuitarFoto").click();
      document.getElementById("fecha").value = new Date().toISOString().slice(0,10);
    } else {
      throw new Error(resultado.message || "Error desconocido");
    }
  }catch(err){
    msgError.textContent = "Ocurrió un error al enviar el registro: " + err.message;
    msgError.className = "mensaje error mostrar";
    window.scrollTo(0,0);
  }finally{
    btnEnviar.disabled = false;
    btnEnviar.textContent = "Enviar registro";
  }
}

</script>
</body>
</html>
